<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="mtFrame" x1="55" y1="9" x2="9" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#19b8cf"/>
      <stop offset="1" stop-color="#2f7df0"/>
    </linearGradient>
    <linearGradient id="mtBarBlue" x1="32" y1="22" x2="32" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4f9ff7"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="mtBarTeal" x1="44" y1="20" x2="44" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22c7d6"/>
      <stop offset="1" stop-color="#1aa6c4"/>
    </linearGradient>
    <linearGradient id="mtLine" x1="15" y1="42" x2="46" y2="19" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2f7df0"/>
      <stop offset="1" stop-color="#16b8cf"/>
    </linearGradient>
  </defs>
  <!-- Rahmen mit offener Ecke oben rechts -->
  <path d="M46 9 H21 Q9 9 9 21 V43 Q9 55 21 55 H43 Q55 55 55 43 V22"
        stroke="url(#mtFrame)" stroke-width="3.2" stroke-linecap="round"/>
  <!-- Balken: drei blau aufsteigend, rechts der höchste in teal -->
  <rect x="16.5" y="39" width="5.5" height="9"  rx="1.5" fill="url(#mtBarBlue)"/>
  <rect x="24.5" y="34" width="5.5" height="14" rx="1.5" fill="url(#mtBarBlue)"/>
  <rect x="32.5" y="28" width="5.5" height="20" rx="1.5" fill="url(#mtBarBlue)"/>
  <rect x="40.5" y="22" width="5.5" height="26" rx="1.5" fill="url(#mtBarTeal)"/>
  <!-- Linie mit Knoten -->
  <polyline points="16,41 24,35 32,30 44,20" stroke="url(#mtLine)" stroke-width="2.4"
            stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="16" cy="41" r="2.9" fill="#2f7df0"/>
  <circle cx="24" cy="35" r="2.9" fill="#2f7df0"/>
  <circle cx="32" cy="30" r="2.9" fill="#2a9fd6"/>
  <circle cx="44" cy="20" r="3.4" fill="#16b8cf"/>
</svg>
